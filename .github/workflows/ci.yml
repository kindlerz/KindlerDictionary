name: CI
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test test/
      - name: Package and lint the zip
        run: |
          zip=$(./package.sh)
          mkdir -p "$RUNNER_TEMP/ext" && unzip -q "$zip" -d "$RUNNER_TEMP/ext"
          npx --yes web-ext@10 lint -s "$RUNNER_TEMP/ext"
