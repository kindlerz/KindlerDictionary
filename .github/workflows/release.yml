name: Release
on:
  push:
    branches: [master]
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test test/*.test.mjs
      - name: Package and lint the zip
        run: |
          zip=$(./package.sh)
          mkdir -p "$RUNNER_TEMP/ext" && unzip -q "$zip" -d "$RUNNER_TEMP/ext"
          npx --yes web-ext@10 lint -s "$RUNNER_TEMP/ext"
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          v=$(node -p "require('./manifest.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            IFS=. read -r major minor patch <<< "$v"
            new="$major.$minor.$((patch + 1))"
            sed -i "s/\"version\": \"$v\"/\"version\": \"$new\"/" manifest.json
            v=$new
            git commit -am "Release v$v"
            git push origin HEAD:master
          fi
          zip=$(./package.sh)
          git tag -a "v$v" -m "Release v$v" && git push origin "v$v"
          gh release create "v$v" "$zip" --title "Release v$v" --generate-notes
